<div class="row" (bbTrackNavigation)="trackNavigation($event)">
  <div class="bb-card col-lg-6">
    <div class="bb-card__header">
      <h1
        class="bb-card__title"
        *ngIf="title !== ''"
        data-role="transactions-view__title"
      >
        {{ title }}
      </h1>
    </div>

    <div class="bb-card__body">
      <div class="bb-block bb-block--md">
        <label
          id="account-selector-label"
          i18n="
            Account selector label - 'Select Account'|This string is used as
            the label for the account selector dropdown in the transactions
            view. It helps users identify the purpose of the dropdown control.
            @@transactions.account-selector.label"
          class="form-label"
        >
          Select Account
        </label>
        <bb-account-selector-ui
          data-role="transactions-view__account-selector"
          ariaLabelledby="account-selector-label"
          placeholder="Select an account"
          i18n-placeholder="
            Account selector placeholder - 'Select an account'|This string is
            used as placeholder text for the account selector dropdown when no
            account is selected.@@transactions.account-selector.placeholder"
          [items]="accounts$ | async"
          [markFirst]="true"
          (change)="onAccountSelected($any($event))"
        ></bb-account-selector-ui>
      </div>

      <div class="bb-block bb-block--md">
        <bb-text-filter
          [text]="searchQuery$ | async"
          (textChange)="search($event)"
        ></bb-text-filter>
      </div>

      <ul *ngIf="transactions$ | async as items; else loading" class="bb-list">
        <li
          *ngFor="let item of items | filterTransactions : filter"
          class="bb-list__item"
          data-role="transactions-view__item-container"
        >
          <a class="list-link" [routerLink]="['./', item.id]">
            <bb-transaction-item
              [transaction]="item"
              [categoryName]="item.category"
            ></bb-transaction-item>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>

<ng-template #loading>
  <div data-role="transactions-view__loading-state-container">
    <bb-loading-indicator-ui loaderSize="lg"></bb-loading-indicator-ui>
  </div>
</ng-template>

<router-outlet></router-outlet>
