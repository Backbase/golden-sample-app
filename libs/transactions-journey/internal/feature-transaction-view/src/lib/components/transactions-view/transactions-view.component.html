<!-- ADR-001: ARIA landmark for page region -->
<div class="row" (bbTrackNavigation)="trackNavigation($event)">
  <div class="bb-card col-lg-6">
    <div class="bb-card__header">
      <h1
        class="bb-card__title"
        *ngIf="title !== ''"
        data-role="transactions-view__title"
      >
        {{ title }}
      </h1>
    </div>

    <div class="bb-card__body">
      <!-- ADR-006: Account Selector from design system -->
      <div class="bb-block bb-block--md" *ngIf="accounts$ | async as accounts">
        <label
          id="transactions-account-selector-label"
          for="transactions-account-selector"
          i18n="
            Select Account label - 'Select Account'|This string is used as the
            label for the Account selector dropdown in the transactions view. It
            is presented to the user when they need to select an account to
            filter transactions. This label is located in the transactions view
            component.@@transactions-journey.account-selector.label"
          class="form-label"
        >
          Select Account
        </label>

        <bb-account-selector-ui
          id="transactions-account-selector"
          dropdownPosition="bottom"
          placeholder="Select an account"
          i18n-placeholder="
            Select account placeholder - 'Select an account'|This string is
            used as the placeholder text for the Account Selector dropdown in
            the transactions view. It is presented to the user when no account
            is selected. This placeholder is located in the transactions view
            component.@@transactions-journey.account-selector.placeholder"
          [items]="accounts"
          [markFirst]="true"
          [closeOnSelect]="true"
          [filterItems]="true"
          (change)="onAccountSelected($any($event))"
          ariaLabelledby="transactions-account-selector-label"
          data-role="transactions-view__account-selector"
        ></bb-account-selector-ui>
      </div>

      <div class="bb-block bb-block--md">
        <bb-text-filter
          [text]="searchQuery$ | async"
          (textChange)="search($event)"
        ></bb-text-filter>
      </div>

      <div
        class="bb-block bb-block--md"
        *ngIf="accountName$ | async as accountName"
      >
        <span
          i18n="
            Label for filtered by - 'filtered by:'|This string is used as the
            label for the filter section in the transactions view. It is
            presented to the user to indicate the criteria by which the
            transactions are filtered. This label is located in the transactions
            view component.@@transactions.filters.label"
          >filtered by:</span
        >

        <bb-badge-ui
          [text]="accountName + ' ✕'"
          title="Remove account filter"
          i18n-title="
            Remove account label for Account Badge - 'Remove account
            filter'|This string is used as the title for the remove account
            filter button in the transactions view. It is presented to the user
            as a tooltip when they hover over the button to remove the account
            filter. This title is located in the transactions view
            component.@@transactions.account-filter.remove"
          class="filters-badge"
          color="success"
          routerLink="/transactions"
          queryParamsHandling="merge"
          [queryParams]="{ account: null }"
        >
        </bb-badge-ui>
      </div>

      <!-- ADR-006: Transaction list with empty state handling -->
      <ng-container *ngIf="transactions$ | async as items; else loading">
        <ng-container *ngIf="(items | filterTransactions : filter).length > 0; else emptyState">
          <ul class="bb-list">
            <li
              *ngFor="let item of items | filterTransactions : filter"
              class="bb-list__item"
              data-role="transactions-view__item-container"
            >
              <a class="list-link" [routerLink]="['./', item.id]">
                <bb-transaction-item
                  [transaction]="item"
                  [categoryName]="item.category"
                ></bb-transaction-item>
              </a>
            </li>
          </ul>
        </ng-container>
      </ng-container>
    </div>
  </div>
</div>

<ng-template #loading>
  <div data-role="transactions-view__loading-state-container">
    <bb-loading-indicator-ui loaderSize="lg"></bb-loading-indicator-ui>
  </div>
</ng-template>

<!-- ADR-006: Empty state from design system for no transactions -->
<ng-template #emptyState>
  <bb-empty-state-ui
    data-role="transactions-view__empty-state"
    iconName="list"
    title="No transactions"
    i18n-title="
      No transactions empty state title - 'No transactions'|This string is used
      as the title for the empty state when no transactions are available for
      the selected account. It is presented to the user when the transaction
      list is empty. This title is located in the transactions view
      component.@@transactions-journey.empty-state.title"
    subtitle="There are no transactions for the selected account."
    i18n-subtitle="
      No transactions empty state subtitle - 'There are no transactions for the
      selected account.'|This string is used as the subtitle for the empty state
      when no transactions are available for the selected account. It is
      presented to the user when the transaction list is empty. This subtitle is
      located in the transactions view
      component.@@transactions-journey.empty-state.subtitle"
  ></bb-empty-state-ui>
</ng-template>

<router-outlet></router-outlet>
