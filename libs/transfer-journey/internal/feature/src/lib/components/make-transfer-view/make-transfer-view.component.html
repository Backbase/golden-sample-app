@if ((vm$ | async)!; as data) { @if (errorAlert$ | async; as error) {
<bb-alert-ui
  modifier="error"
  [dismissible]="true"
  [title]="error"
  (close)="hideErrorAlert()"
>
  <span data-role="error-message">
    @switch (error) { @case ('NOT_FOUND') {
    <p>Not found error</p>
    } @case ('UNKNOWN_ERROR') {
    <p>There was an {{ error }}</p>
    } }
  </span>
</bb-alert-ui>
} @if ((limit$ | async)!; as limit) { @if (!isLoading(data.loadingStatus)) {
<bb-make-transfer-form
  [account]="data.account"
  [showMaskIndicator]="config.maskIndicator ?? true"
  (submitTransfer)="submitTransfer($event)"
  [maxLimit]="limit"
></bb-make-transfer-form>
} @else {
<bb-loading-indicator-ui loaderSize="lg"></bb-loading-indicator-ui>
} } }
