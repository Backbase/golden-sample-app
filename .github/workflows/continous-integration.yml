name: CI

on:
  pull_request:
    branches:
      - feature/BBNC-64-ai-adlc-web

permissions:
  contents: read

jobs:
  llm-as-a-judge:
    name: "LLM-as-a-judge"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -r scripts/requirements.txt

      - run: deepeval test run scripts/test_select_adrs.py
