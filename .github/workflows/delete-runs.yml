name: Delete old workflow runs
on: workflow_dispatch

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@985dd74b0d2e2de304b17b4a7fd8a019f8e0b4f8 #v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
